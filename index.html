<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulsar Music | Пошаговая загрузка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #a855f7; --text: #fff; --muted: #aaa; --input: #2d2d2d; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .progress-bar::before { content: ''; position: absolute; top: 15px; left: 0; right: 0; height: 2px; background: #333; z-index: 1; }
        .step-dot { width: 30px; height: 30px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; z-index: 2; position: relative; transition: 0.3s; }
        .step-dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 20px; margin-top: 0; color: var(--accent); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="url"], input[type="date"] {
            width: 100%; box-sizing: border-box; background: var(--input); border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 15px;
        }
        input:focus { border-color: var(--accent); }

        .checkbox-group { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .checkbox-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.4; color: #ddd; }
        .checkbox-item input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-next, .btn-submit { background: linear-gradient(90deg, #a855f7, #ec4899); color: white; }
        .btn-prev { background: #333; color: white; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="progress-bar">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-dot" id="dot2">2</div>
            <div class="step-dot" id="dot3">3</div>
        </div>

        <form id="wizardForm">
            <!-- ШАГ 1 -->
            <div class="step-content active" id="step1">
                <h2>Шаг 1. О треке</h2>
                <div class="form-group"><label>Имя артиста / Псевдоним</label><input type="text" id="artist" required></div>
                <div class="form-group"><label>Название трека</label><input type="text" id="track" required></div>
                <div class="form-group"><label>Ваш Email</label><input type="email" id="email" required></div>
                <div class="form-group"><label>Желаемая дата релиза</label><input type="date" id="date" required></div>
                <div class="btn-row"><button type="button" class="btn-next" onclick="nextStep(1)">Далее</button></div>
            </div>

            <!-- ШАГ 2 -->
            <div class="step-content" id="step2">
                <h2>Шаг 2. Материалы</h2>
                <div class="form-group"><label>Ссылка на WAV-файл (Яндекс.Диск/Google Drive)</label><input type="url" id="wav" required></div>
                <div class="form-group"><label>Ссылка на обложку 3000х3000</label><input type="url" id="cover" required></div>
                <div class="form-group"><label>ФИО автора текста (если не вы)</label><input type="text" id="authorText"></div>
                <div class="form-group"><label>ФИО автора музыки/аранжировки</label><input type="text" id="authorMusic"></div>
                <div class="btn-row">
                    <button type="button" class="btn-prev" onclick="prevStep(2)">Назад</button>
                    <button type="button" class="btn-next" onclick="nextStep(2)">Далее</button>
                </div>
            </div>

            <!-- ШАГ 3 -->
            <div class="step-content" id="step3">
                <h2>Шаг 3. Права и Соцсети</h2>
                <div class="form-group"><label>Ссылка на ВК / YouTube</label><input type="url" id="socials" required></div>

                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" id="rightsText" required> <span>У меня есть договор с автором текста (или текст мой)</span></div>
                    <div class="checkbox-item"><input type="checkbox" id="rightsMusic" required> <span>У меня есть договор с автором музыки (или музыка моя)</span></div>
                    <div class="checkbox-item"><input type="checkbox" id="agreeDist" required> <span>Согласен с условиями: 1500 ₽ разово + 15% роялти, эксклюзив Pulsar Music на 2 года (без удаления).</span></div>
                </div>

                <div class="btn-row">
                    <button type="button" class="btn-prev" onclick="prevStep(3)">Назад</button>
                    <button type="submit" class="btn-submit">Отправить</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Безопасная инициализация Telegram
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.expand();
        }

        let currentStep = 1;

        function nextStep(step) {
            const currentForm = document.getElementById('step' + step);
            const inputs = currentForm.querySelectorAll('input[required]');
            let isValid = true;

            inputs.forEach(input => {
                if (!input.value.trim()) {
                    isValid = false;
                    input.style.borderColor = '#f44336'; // подсветка пустого поля
                } else {
                    input.style.borderColor = '#444';
                }
            });

            if (!isValid) {
                alert("Пожалуйста, заполните все обязательные поля.");
                return;
            }

            document.getElementById('step' + step).classList.remove('active');
            document.getElementById('dot' + step).classList.remove('active');

            currentStep++;
            document.getElementById('step' + currentStep).classList.add('active');
            document.getElementById('dot' + currentStep).classList.add('active');
        }

        function prevStep(step) {
            document.getElementById('step' + step).classList.remove('active');
            document.getElementById('dot' + step).classList.remove('active');

            currentStep--;
            document.getElementById('step' + currentStep).classList.add('active');
            document.getElementById('dot' + currentStep).classList.add('active');
        }

        document.getElementById('wizardForm').onsubmit = function(e) {
            e.preventDefault();

            const data = `АРТИСТ: ${document.getElementById('artist').value}
ТРЕК: ${document.getElementById('track').value}
EMAIL: ${document.getElementById('email').value}
ДАТА: ${document.getElementById('date').value}

ССЫЛКА WAV: ${document.getElementById('wav').value}
ССЫЛКА ОБЛОЖКА: ${document.getElementById('cover').value}

АВТОР ТЕКСТА: ${document.getElementById('authorText').value}
АВТОР МУЗЫКИ: ${document.getElementById('authorMusic').value}

СОЦСЕТИ: ${document.getElementById('socials').value}

[СОГЛАСЕН С УСЛОВИЯМИ: 1500р + 15% + 2 года]`;

            const email = "manager@pulsarmusic.ru";
            const subject = `Новый релиз: ${document.getElementById('track').value}`;
            const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(data)}`;

            if (tg) {
                tg.showPopup({
                    title: 'Успешно!',
                    message: 'Заявка сформирована. Сейчас откроется почта для отправки.',
                    buttons: [{type: 'ok'}]
                }, function() {
                    window.location.href = mailtoLink;
                });
            } else {
                window.location.href = mailtoLink;
            }
        };
    </script>
</body>
</html>
